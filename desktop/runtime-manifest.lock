        "note": "Appended by stage-runtime.sh AFTER extracting+verifying the upstream original (see this target's entries[] for containers.conf's own pinned sha256) — TWO independent, complementary transformations, both applied by _patch_containers_conf and verified together as one hash: (1) patch_containers_conf_for_bundled_helpers: helper_binaries_dir = [\"$BINDIR/../libexec/podman\", \"$BINDIR\"] under [engine], plus a new [network] section with default_rootless_network_cmd = \"pasta\". Without helper_binaries_dir, a host with any podman already installed silently uses ITS netavark/aardvark-dns/rootlessport instead of the bundled ones (confirmed on the DGX: fell back to system netavark 1.4.0 instead of the bundled 2.1.0 until this was added). $BINDIR is containers-common's own token for \"directory of the currently running podman binary\", resolved fresh at runtime — correct both here and at the app's real ~/.safent/runtime/<version>/ deploy path. Verified live on this DGX (2026-09-10): the bundled podman 6.1.1 + netavark 2.1.0 + this patched containers.conf correctly resolve the bundled pasta (passt 2026_06_11.a9c61ff) and rootless-published a real port end to end, both for a plain alpine listener and for the actual ghcr.io/devwspito/safent:0.8.42 image on port 7517 (HTTP 307 received through the mapped port) — pasta's own --map-guest-addr support was NOT the problem this pair actually has; see research.md for the full investigation. (2) patch_containers_conf_for_isolated_locks: lock_type = \"file\" under [engine] — a bundled static/musl podman and the host's own glibc podman/docker, run as the same uid, collide on ONE shared /dev/shm rootless-lock segment sized differently by each libc's pthread_mutex_t layout (reproduced live, specs/028-safent-app-nativa/verificacion-paquete-linux.md §\"Pasada 1\": \"failed to open 2048 locks in /libpod_rootless_lock_1000: numerical result out of range\"); file locks per storage tree make the collision impossible regardless of