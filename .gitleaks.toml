# gitleaks config for safent-runtime — secret-scan gate (CI + local).
#
# Verified 2026-07-05 (269 commits / 58 branches) and 2026-09-16 (808 commits): full history + working tree are
# CLEAN of real credentials. The only matches are 4 obvious TEST FIXTURES, allow-
# listed BELOW BY EXACT VALUE (never by a broad `tests/**` path) — so a NEW real
# secret committed into a test file is still caught.
#
# Run locally:  gitleaks detect --source . --config .gitleaks.toml
title = "safent-runtime"

[extend]
useDefault = true

[allowlist]
description = "Known fake test fixtures (asserted-not-real by their own names)."
regexes = [
  # tests/unit/instance/test_association_store.py — fake instance secret
  '''sk-test-instance-secret-12345''',
  # tests/unit/browser/testing/test_in_memory_live_view_authz.py — fake live-view token
  '''tok_valid_abc123''',
  # redaction/logging tests — fixtures whose VALUE asserts they must not leak
  '''sk-supersecret-api-key-12345''',
  '''super-secret-bearer-token-DO-NOT-LOG''',
  # tests/integration/test_self_enqueue_depth_cap.py — dedup_key strings (not secrets)
  '''followup-mother-1''',
  '''grandchild-dedup-1''',
  # tests/unit/ops/test_companion_provision.py — fake gen_keys output from the
  # faked podman binary (base64 of "fake-signing-key-b64" / "fake-public-key-b64")
  '''ZmFrZS1zaWduaW5nLWtleS1iNjQ=''',
  '''ZmFrZS1wdWJsaWMta2V5LWI2NA==''',
  '''tskey-abc123(-should-never-be-in-argv)?''',
  '''tskey-secret''',
]
# specs/028-safent-app-nativa/qa-native-0.9.14/verify_live.py (guion de QA ya borrado): el
# valor señalado es un id de contenedor de 64 hex, no una credencial. Ruta exacta, no comodín.
paths = [
  '''^specs/028-safent-app-nativa/qa-native-0\.9\.14/verify_live\.py$''',
]
