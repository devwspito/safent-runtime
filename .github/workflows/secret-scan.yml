name: secret-scan

# Fail the build if a real credential is ever committed. Runs on every push/PR and
# scans the FULL git history (not just the diff), using .gitleaks.toml (which
# allow-lists only the known fake test fixtures, by exact value). This is the gate
# that keeps the open-source Community repo safe as it grows.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin version and the official release archive's SHA-256 before extracting. Running the
      # binary directly (not gitleaks-action) avoids the org-license requirement and
      # keeps the gate dependency-light.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
          GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
        run: |
          set -euo pipefail
          scan_tmp="$(mktemp -d)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$scan_tmp/gitleaks.tgz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$scan_tmp/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$scan_tmp/gitleaks.tgz" -C "$scan_tmp" gitleaks
          sudo install -m 0755 "$scan_tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history for secrets
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload findings (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
